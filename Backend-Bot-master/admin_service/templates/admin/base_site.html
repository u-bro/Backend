{% extends "admin/base.html" %}

{% block extrahead %}
  {{ block.super }}
  <style>
    .moderation-menu-badge { display: inline-block; margin-left: 5px; border-radius: 999px; background: #dc3545; color: #fff; padding: 1px 6px; font-size: 11px; line-height: 1.4; }
  </style>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const count = "{{ moderation_queue_count|default:0 }}";
      document.querySelectorAll("a").forEach(function (link) {
        if (link.textContent.trim() === "Модерация водителей" && !link.querySelector(".moderation-menu-badge")) {
          const badge = document.createElement("span");
          badge.className = "moderation-menu-badge";
          badge.textContent = count;
          link.appendChild(badge);
        }
      });
    });
  </script>
{% endblock %}
