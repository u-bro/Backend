name: Deploy-dev

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy development
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            cd /home/deploy-dev/ubro_backend

            echo "=== Sync repository ==="
            git fetch origin dev
            git checkout dev
            git reset --hard origin/dev

            echo "=== Current commit ==="
            git log -1 --oneline

            cd Backend-Bot-master

            echo "=== Build and start ==="
            docker compose -p ubro-dev \
              -f docker-compose.yml \
              -f docker-compose.dev.yml \
              up -d --build

            echo "=== Wait for startup ==="
            sleep 10

            echo "=== Containers ==="
            docker compose -p ubro-dev \
              -f docker-compose.yml \
              -f docker-compose.dev.yml \
              ps -a

            echo "=== Check migration ==="
            MIGRATION_EXIT_CODE=$(docker inspect \
              -f '{{.State.ExitCode}}' \
              ubro-dev-migration-1)

            if [ "$MIGRATION_EXIT_CODE" != "0" ]; then
              echo "Migration failed with exit code $MIGRATION_EXIT_CODE"
              docker compose -p ubro-dev \
                -f docker-compose.yml \
                -f docker-compose.dev.yml \
                logs --tail=200 migration
              exit 1
            fi

            echo "=== Check FastAPI container ==="
            FASTAPI_RUNNING=$(docker inspect \
              -f '{{.State.Running}}' \
              ubro-dev-fastapi_app-1)

            if [ "$FASTAPI_RUNNING" != "true" ]; then
              echo "FastAPI container is not running"
              docker compose -p ubro-dev \
                -f docker-compose.yml \
                -f docker-compose.dev.yml \
                logs --tail=200 fastapi_app
              exit 1
            fi

            echo "=== Deploy completed successfully ==="